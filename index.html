  <script>
    const videos = [...document.querySelectorAll('video')];
    const nearViewport = new Set();
    function play(video) {
      video.muted = true;
      if (!document.hidden) video.play().catch(() => {});
    }
    for (const video of videos) {
      video.addEventListener('loadeddata', () => video.classList.add('ready'));
      video.addEventListener('playing', () => video.classList.add('ready'));
    }
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => {
        for (const { target, isIntersecting } of entries) {
          if (isIntersecting) { nearViewport.add(target); play(target); }
          else { nearViewport.delete(target); target.pause(); }
        }
      }, { rootMargin: '100% 0px', threshold: 0 });
      videos.forEach(video => observer.observe(video));
    } else {
      videos.forEach(video => { nearViewport.add(video); play(video); });
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) videos.forEach(video => video.pause());
      else nearViewport.forEach(play);
    });
    // Resume if a browser initially requires a user gesture for media playback.
    document.addEventListener('pointerdown', () => nearViewport.forEach(play), { passive: true });
    document.addEventListener('touchstart', () => nearViewport.forEach(play), { passive: true });
  </script>
